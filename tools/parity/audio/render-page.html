<!doctype html>
<meta charset="utf-8" />
<title>audio reference renderer</title>
<script type="module">
  import { AudioEngine } from "/web/engine/audio.js";
  import { mulberry32, SEED, SAMPLE_RATE } from "/audio/cues.mjs";

  const realCurrentTime = Object.getOwnPropertyDescriptor(BaseAudioContext.prototype, "currentTime").get;

  function toBase64(f32) {
    const bytes = new Uint8Array(f32.buffer, f32.byteOffset, f32.byteLength);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.__render = async (sc) => {
    const frames = Math.ceil(sc.seconds * SAMPLE_RATE);
    let draws = 0;
    const rnd = mulberry32(SEED);
    Math.random = () => {
      draws++;
      return rnd();
    };

    const ctx = new OfflineAudioContext(2, frames, SAMPLE_RATE);
    let override = null;
    Object.defineProperty(ctx, "currentTime", {
      get() {
        return override === null ? realCurrentTime.call(ctx) : override;
      },
    });
    const realResume = ctx.resume.bind(ctx);
    ctx.resume = () => Promise.resolve();
    window.AudioContext = function () {
      return ctx;
    };
    window.webkitAudioContext = window.AudioContext;

    const audio = new AudioEngine();
    const run = (c) => {
      const args = c.a.map((x) => (x === "@now" ? ctx.currentTime : x));
      audio[c.m](...args);
    };

    if (!sc.noInit) {
      override = 0;
      audio.publicInit();
    }
    override = 0.01;
    for (const s of sc.setup ?? []) run(s);

    const ordered = [...sc.calls].sort((a, b) => a.t - b.t);
    for (const c of ordered) {
      override = c.t;
      run(c);
    }
    override = null;

    for (const s of sc.suspends ?? []) {
      ctx.suspend(s.at).then(() => {
        for (const c of s.calls) run(c);
        realResume().catch(() => {});
      });
    }

    const buf = await ctx.startRendering();
    const channels = [];
    for (let c = 0; c < buf.numberOfChannels; c++) channels.push(toBase64(buf.getChannelData(c)));
    return { draws, frames, sampleRate: buf.sampleRate, channels };
  };

  window.__ready = true;
</script>
