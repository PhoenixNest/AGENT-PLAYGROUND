<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/__parity/fonts.css">
<style>html,body{margin:0;padding:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/__cc/lib/wrap.js"></script>
<script src="/__cc/lib/player.js"></script>
<script>
  window.__cc.installParity();
  window.__replayReady = (async () => {
    const fonts = ["400 16px Fredoka", "700 16px Fredoka", "700 16px Nunito", "800 16px Nunito", "900 16px Nunito",
      '16px "Noto Sans Symbols 2"', '16px "Noto Sans Symbols"'];
    await Promise.all(fonts.map((f) => document.fonts.load(f, "AaBb✓▶←×•")));
    const index = await (await fetch("/__parity/emoji/index.json")).json();
    await window.__cc.preloadEmoji(index);
    await document.fonts.ready;
  })();
  window.__replay = async (stream) => {
    await window.__replayReady;
    const canvas = document.getElementById("c");
    window.__cc.replay(stream, canvas);
    return canvas.toDataURL("image/png");
  };
</script>
</body>
</html>
